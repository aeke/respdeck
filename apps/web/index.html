<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121317" />
    <meta
      name="description"
      content="RESPdeck — a thoughtful workspace for your Redis data. Open source, self-hosted, beautifully simple."
    />
    <title>RESPdeck — Your Redis workspace</title>
    <script>
      try {
        let t = localStorage.getItem('respdeck-theme') || 'dark';
        document.documentElement.dataset.theme =
          t === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : t;
        document.documentElement.dataset.accent =
          localStorage.getItem('respdeck-accent') || 'violet';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
