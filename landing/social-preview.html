<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>RESPdeck social preview</title>
    <style>
      @font-face {
        font-family: Inter;
        src: url('../apps/web/node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: Inter;
        src: url('../apps/web/node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2');
        font-weight: 600;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #101014;
        color: #f3f2f8;
        font-family: Inter, sans-serif;
      }
      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 58px 62px;
        overflow: hidden;
        background: radial-gradient(ellipse at 85% 45%, #292039 0, transparent 58%);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 13px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -1px;
      }
      .brand img {
        width: 45px;
        height: 45px;
      }
      h1 {
        font-size: 79px;
        line-height: 1.06;
        letter-spacing: -4px;
        font-weight: 600;
        margin: 63px 0 22px;
      }
      h1 span {
        color: #b6a5ff;
      }
      .description {
        font-size: 19px;
        line-height: 1.7;
        color: #b9b4c7;
        margin: 0;
      }
      .badges {
        display: flex;
        gap: 10px;
        margin-top: 29px;
      }
      .badges span {
        font-size: 11px;
        letter-spacing: 0.8px;
        padding: 8px 12px;
        border: 1px solid #42384e;
        border-radius: 6px;
        color: #d1c8e2;
        background: #1c1826;
      }
      .address {
        position: absolute;
        bottom: 40px;
        left: 62px;
        color: #a8a1b8;
        font-size: 14px;
        letter-spacing: 0.1px;
      }
      .preview {
        position: absolute;
        left: 610px;
        top: 111px;
        width: 825px;
        height: 458px;
        overflow: hidden;
        border: 1px solid #4c405d;
        border-radius: 13px;
        background: #15151d;
        box-shadow: 0 20px 80px #0008;
        transform: rotate(-3deg);
      }
      .bar {
        height: 29px;
        border-bottom: 1px solid #393040;
        padding: 10px 14px;
        display: flex;
        gap: 5px;
      }
      .bar i {
        width: 6px;
        height: 6px;
        background: #665875;
        border-radius: 50%;
      }
      .preview img {
        display: block;
        width: 825px;
        height: auto;
      }
      .mark {
        position: absolute;
        right: 48px;
        top: 57px;
        color: #d3c5eb;
        font-size: 10px;
        letter-spacing: 2px;
      }
      .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #79cbb0;
        border-radius: 50%;
        margin-right: 8px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><img src="../apps/web/public/favicon.svg" alt="" />RESPdeck</div>
      <div class="mark"><span class="dot"></span>YOUR REDIS WORKSPACE</div>
      <h1>Your Redis,<br /><span>in focus.</span></h1>
      <p class="description">
        A modern, self-hosted web UI.<br />Thoughtful themes. Powerful data browsing.
      </p>
      <div class="badges">
        <span>OPEN SOURCE</span><span>SELF-HOSTED</span><span>MIT LICENSE</span>
      </div>
      <div class="address">github.com/aeke/respdeck</div>
      <div class="preview">
        <div class="bar"><i></i><i></i><i></i></div>
        <img src="../docs/screenshots/dark.png" alt="RESPdeck data browser" />
      </div>
    </main>
  </body>
</html>
